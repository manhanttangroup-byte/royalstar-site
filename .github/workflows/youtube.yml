name: Latest YouTube videos
# Every 3 hours: refresh videos.json from the channel's public feed. GitHub Pages redeploys on push,
# so new public uploads appear on royalstarcorp.com automatically.
on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/youtube_feed.py videos.json
      - run: |
          if git diff --quiet -- videos.json; then echo "no new videos"; exit 0; fi
          git config user.name "royalstar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add videos.json
          git commit -m "Update latest YouTube videos"
          git push
